name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Newer Flutter versions may migrate files during the steps above; show what changed.
      - run: git diff
      - run: git checkout -- . && dart pub publish --dry-run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - run: flutter pub get && flutter build apk --config-only
        working-directory: example
      - run: ./gradlew --no-daemon :patchkite:testDebugUnitTest
        working-directory: example/android
