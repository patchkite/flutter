name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write
  id-token: write # pub.dev automated publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pub.dev
    steps:
      - uses: actions/checkout@v7
      # Configures the OIDC token that pub.dev accepts for automated publishing.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check tag matches pubspec version
        run: |
          test "v$(sed -n 's/^version: *//p' pubspec.yaml)" = "$GITHUB_REF_NAME"
      - run: flutter pub get
      - run: flutter test
      - run: flutter pub publish --force
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
