group = "io.github.patchkite.flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.4.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.13.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// Flutter engine revision used to build this app. A libapp.so update is only
// compatible with the exact same engine.
def patchkiteEngineRevision = {
    def props = new Properties()
    def local = rootProject.file("local.properties")
    if (local.exists()) local.withInputStream { props.load(it) }
    def sdk = props.getProperty("flutter.sdk") ?: System.getenv("FLUTTER_ROOT")
    def f = sdk ? new File(sdk, "bin/internal/engine.version") : null
    if (f == null || !f.exists()) f = sdk ? new File(sdk, "bin/cache/engine.stamp") : null
    return (f != null && f.exists()) ? f.text.trim() : ""
}()

android {
    namespace = "io.github.patchkite.flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        buildConfigField "String", "PATCHKITE_ENGINE_REVISION", "\"${patchkiteEngineRevision}\""
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        unitTests.all {
            // Shared test fixtures (test/fixtures), generated by the Patchkite server implementation.
            systemProperty "patchkite.fixtures", new File(projectDir.canonicalFile, "../test/fixtures").canonicalPath
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.17"
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}
